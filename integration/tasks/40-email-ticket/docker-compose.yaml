services:
  client:
    build:
      context: ..
      dockerfile: 40-email-ticket/Dockerfile
    image: ${APEX_TASK_DOCKER_CLIENT_IMAGE_NAME}
    container_name: ${APEX_TASK_DOCKER_CLIENT_CONTAINER_NAME}
    command:
    - sh
    - -c
    - sleep infinity
    depends_on:
      mailhog:
        condition: service_healthy
      plane-api:
        condition: service_started
    environment:
    - TEST_DIR=${APEX_TEST_DIR}
    - POSTGRES_USER=testuser
    - POSTGRES_PASSWORD=testpass
    - POSTGRES_DB=testdb
    - POSTGRES_HOST=127.0.0.1
    - POSTGRES_PORT=5432
    - DATABASE_URL=postgresql://testuser:testpass@127.0.0.1:5432/testdb
    - IS_MATTERMOST_AVAILABLE=false
    networks:
      demo-network:
        aliases:
        - client
    volumes:
    - ${APEX_TASK_LOGS_PATH}:${APEX_CONTAINER_LOGS_PATH}
    - ${APEX_TASK_AGENT_LOGS_PATH}:${APEX_CONTAINER_AGENT_LOGS_PATH}
    - task-config:/config
    tmpfs:
    - /tmp/postgres-data:rw,size=2g
    ports:
    - '5432'
    healthcheck:
      test:
      - CMD-SHELL
      - |
        pg_isready -h 127.0.0.1 -p 5432 -U testuser && \
        curl -sf http://mailhog:8025/api/v2/messages | jq -e '.total >= 1' && \
        echo 'PostgreSQL and MailHog seed READY' || \
        { echo 'Not ready'; exit 1; }
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ${APEX_TASK_DOCKER_CLIENT_CONTAINER_NAME}-mailhog
    command:
    - -smtp-bind-addr
    - 0.0.0.0:1025
    - -api-bind-addr
    - 0.0.0.0:8025
    - -ui-bind-addr
    - 0.0.0.0:8025
    ports:
    - '1025'
    - '8025'
    networks:
      demo-network:
        aliases:
        - mailhog
    restart: unless-stopped
    environment:
    - MH_HOSTNAME=mailhog.example.com
    - MH_STORAGE=memory
    labels:
    - group=mailhog
    - category=email
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://127.0.0.1:8025/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  plane-api:
    container_name: ${APEX_TASK_DOCKER_CLIENT_CONTAINER_NAME}-plane
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${PLANE_IMAGE_TAG}
    restart: unless-stopped
    ports:
    - '8000'
    networks:
      demo-network:
        aliases:
        - plane-api
    env_file:
    - ../shared/config/plane/.env.lightweight
    volumes:
    - task-config:/config
    - ./data:/data
    - ../shared/mcp-servers:/app/mcp-servers
    tmpfs:
    - /tmp/postgres-data:rw,size=4g
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://127.0.0.1:8000/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
    - group=plane
    - category=backend
volumes:
  task-config: null
networks:
  demo-network:
    driver: bridge
